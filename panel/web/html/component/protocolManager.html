{{define "component/protocolManager"}}
<script type="text/x-template" id="protocol-manager-template">
 <a-card title="VPN-подключения" hoverable style="margin-bottom:16px">
  <template slot="extra"><a-button icon="sync" :loading="busy" @click="load" aria-label="Обновить подключения"></a-button></template>
  <a-alert v-if="error" type="error" show-icon :message="error" style="margin-bottom:12px"></a-alert>
  <a-dropdown :trigger="['click']" :disabled="!profiles.some(p=>!p.present)" style="margin-bottom:12px">
   <a-button type="primary" icon="plus" :disabled="busy || !profiles.some(p=>!p.present)">Создать подключение</a-button>
   <a-menu slot="overlay" @click="({key})=>change(profiles.find(p=>p.id===key),'create')">
    <a-menu-item v-for="row in profiles.filter(p=>!p.present)" :key="row.id">[[ row.name ]]</a-menu-item>
   </a-menu>
  </a-dropdown>
  <a-table :columns="columns" :data-source="profiles.filter(p=>p.present)" row-key="id" :pagination="false" :scroll="{x:1084}" bordered size="middle">
   <template slot="operate" slot-scope="_,row">
    <a-dropdown :trigger="['click']">
     <a-icon type="more" style="font-size:16px;cursor:pointer" tabindex="0" role="button" @keydown.enter.prevent="$event.currentTarget.click()" @keydown.space.prevent="$event.currentTarget.click()" :aria-label="'Действия: '+row.name"></a-icon>
     <a-menu slot="overlay" :theme="themeSwitcher.currentTheme">
      <a-menu-item v-if="row.id==='wdtt'" @click="$emit('edit-wdtt')"><a-icon type="edit"></a-icon>Изменить</a-menu-item>
      <a-menu-item @click="select(row)"><a-icon type="team"></a-icon>Пользователи</a-menu-item>
      <a-menu-item @click="deleteProfile(row)"><span style="color:#ff4d4f"><a-icon type="delete"></a-icon>Удалить</span></a-menu-item>
     </a-menu>
    </a-dropdown>
   </template>
   <template slot="enable" slot-scope="_,row"><a-tooltip :title="row.enabled && !row.active ? 'Служба не запущена — проверьте журнал' : ''"><a-switch :checked="row.enabled" :loading="busy" @change="enabled=>change(row,enabled?'enable':'disable')"></a-switch></a-tooltip></template>
   <template slot="ports" slot-scope="_,row"><div style="display:flex;flex-wrap:wrap;justify-content:center"><a-tag v-for="(port,index) in row.ports" :key="port" :color="['blue','green','orange','cyan'][index]" style="margin:2px">[[ port ]]</a-tag></div></template>
   <template slot="protocol" slot-scope="_,row"><a-tag v-for="(label,index) in row.protocol_labels" :key="label" :color="['purple','blue','green','orange'][index]" style="margin:2px">[[ label ]]</a-tag></template>
   <template slot="subnet" slot-scope="_,row"><div v-for="subnet in row.subnets || [row.subnet]" :key="subnet">[[ subnet ]]</div></template>
   <template slot="users" slot-scope="_,row"><a @click="select(row)"><a-tag color="green" style="margin:0">[[ row.users || 0 ]]</a-tag></a></template>
   <template slot="total" slot-scope="_,row"><a-tag color="green" style="margin:0">[[ bytes(row.traffic_bytes || 0) ]] / ∞</a-tag></template>
  </a-table>
 </a-card>
</script>
<script>
Vue.component('protocol-manager', {
 template:'#protocol-manager-template', delimiters:['[[',']]'],
 data(){return {
  themeSwitcher,profiles:[],busy:false,error:'',
  columns:[{title:'ID',dataIndex:'display_id',width:48,align:'center'},{title:'Меню',scopedSlots:{customRender:'operate'},width:60,align:'center'},{title:'Включить',scopedSlots:{customRender:'enable'},width:86,align:'center'},{title:'Примечание',dataIndex:'name',width:150},{title:'Порт',scopedSlots:{customRender:'ports'},width:160,align:'center'},{title:'Протокол',scopedSlots:{customRender:'protocol'},width:200,align:'center'},{title:'Подсеть',scopedSlots:{customRender:'subnet'},width:145,align:'center'},{title:'Пользователи',scopedSlots:{customRender:'users'},width:105,align:'center'},{title:'Трафик',scopedSlots:{customRender:'total'},width:130,align:'center'}],

 }},
 methods:{
  async call(data){const result=await panelApiJson('panel/api/protocols',{method:'POST',body:JSON.stringify(data)});return result.obj;},
  async perform(fn){this.busy=true;this.error='';try{await fn();}catch(e){this.error=e.response?.data?.msg||e.message||'Ошибка запроса';this.$message.error(this.error);}finally{this.busy=false;}},
  async load(){await this.perform(async()=>{const result=await HttpUtil.get('/panel/api/protocols');if(!result.success)throw new Error(result.msg);this.profiles=result.obj;});},
  async change(row,op){await this.perform(async()=>{await this.call({op,protocol:row.id});});await this.load();},
  deleteProfile(row){this.$confirm({title:'Удалить '+row.name+'?',content:'Настройки и пользователи сохранятся для повторного создания.',okText:'Удалить',cancelText:'Отмена',okType:'danger',onOk:()=>this.change(row,'delete')});},
  select(){location.href=basePath+'panel/users';},
  bytes(value){if(!value)return '0 Б';const n=Math.min(4,Math.floor(Math.log(value)/Math.log(1024)));return (value/1024**n).toFixed(n?2:0)+' '+['Б','КиБ','МиБ','ГиБ','ТиБ'][n];}
 },mounted(){this.load();}
});
</script>
{{end}}
