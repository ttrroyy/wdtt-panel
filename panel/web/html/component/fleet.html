{{define "component/fleet"}}
<style>
.fleet-list{display:grid;gap:12px}.fleet-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid var(--rl-line);border-radius:18px;min-width:0}.fleet-row-main{min-width:0}.fleet-muted{color:var(--rl-muted);font-size:12px;overflow-wrap:anywhere}.fleet-actions{display:flex;gap:8px;flex-shrink:0}.fleet-chain{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}.fleet-step{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--rl-line);border-radius:16px}.fleet-step .ant-btn{padding:0 5px}.fleet-empty{text-align:center;padding:28px 12px;color:var(--rl-muted)}
@media(max-width:600px){.fleet-row{align-items:flex-start;flex-direction:column;gap:12px}.fleet-actions{align-self:flex-end}.fleet-chain{gap:6px}.fleet-step{padding:8px}.fleet-modal .ant-modal{max-width:calc(100vw - 24px);margin:12px auto;top:12px}}
</style>
<script>
async function fleetRequest(path,body){
 const headers={'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'};
 if(body&&typeof wdttCsrfToken==='function')headers['X-CSRF-Token']=wdttCsrfToken();
 const response=await fetch(basePath+'panel/api/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers,...(body?{body:JSON.stringify(body)}:{})});
 if(response.status===401){location.href=basePath;throw new Error('Сессия истекла');}
 const result=await response.json();if(!result.success)throw new Error(result.msg||'Ошибка запроса');return result.obj;
}
</script>
{{end}}
