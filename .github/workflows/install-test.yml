name: Install test

# The installer as a client runs it on a fresh VPS (PanelCommands.install): a node and a panel with a node.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [install.sh, scripts/**, .github/workflows/install-test.yml]

jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            panel/go.sum
            server/go.sum
      - run: bash -n install.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test ./... ./panel/... ./server/...
  install:
    needs: regressions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        role: [node, combined]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install as the client does
        run: |
          sudo cp install.sh /root/wdtt-install.sh
          protocols=wdtt,qwdtt
          if [ "${{ matrix.os }}/${{ matrix.role }}" = "ubuntu-24.04/combined" ]; then protocols+=,mrtt; fi
          sudo env WDTT_PROTOCOLS="$protocols" WDTT_FRONTEND=local WDTT_DNS_ZONE='' WDTT_DNS_NS='' bash /root/wdtt-install.sh ${{ matrix.role }} 2>&1 | tee install.log
          test "${PIPESTATUS[0]}" = 0
      - name: Test an isolated MRTT server and its subscription link
        if: matrix.os == 'ubuntu-24.04' && matrix.role == 'combined'
        run: |
          sudo python3 - <<'PY'
          import sys
          import time
          sys.path.insert(0,'/usr/local/lib/wdtt')
          import protocols as panel
          for attempt in range(12):
              try:
                  panel.request('mrtt','/api/clients')
                  break
              except (OSError, RuntimeError, ValueError):
                  if attempt == 11: raise
                  time.sleep(2)
          created = panel.create_user('mrtt', {'name':'CI MRTT', 'days':0})
          try:
              client = next(row for row in panel.display_users('mrtt') if row['password'] == created['password'])
              assert client['link'].startswith('mrtt://')
              assert all(address.startswith('10.75.67.') for address in client['ips']) and client['ips']
          finally:
              panel.mutate_user('mrtt', {'password':created['password']}, delete=True)
          PY
      - name: Status
        if: always()
        run: sudo bash /root/wdtt-install.sh status 2>&1 | tail -40 || true

  # A person runs the installer by hand: questions are answered on the terminal, not in the environment.
  prompts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Answers typed on a terminal
        run: |
          cd scripts && python3 -m unittest test_installation.TerminalPromptTests test_frontend.FrontendTests.test_a_question_reads_the_answer_from_a_terminal && cd ..
          export WDTT_SELECTION_DIR=$(mktemp -d)
          printf '1,dnstt\n\n3\n' | script -qec 'python3 scripts/local-install.py choose && python3 scripts/frontend.py choose' /dev/null
          python3 - <<'PY'
          import json, os
          d = os.environ['WDTT_SELECTION_DIR']
          assert json.load(open(d + '/install-selection.json'))['protocols'] == ['wdtt', 'dnstt']
          assert json.load(open(d + '/frontend-selection.json'))['mode'] == 'local'
          PY
