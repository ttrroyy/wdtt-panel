name: Build WDTT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packaged-cores:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.download.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for both core packages for these build inputs
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="cores-$(python3 scripts/cores.py fingerprint)"
          mkdir -p cached-cores
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D cached-cores -p 'wdtt-cores-linux-*.tar.gz*'; then
            echo available=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd cached-cores
          for arch in x86_64 aarch64; do
            archive="wdtt-cores-linux-$arch.tar.gz"
            if ! test -s "$archive" || ! test -s "$archive.sha256" ||
               ! read -r digest checked extra < "$archive.sha256" ||
               ! [[ "$digest" =~ ^[a-f0-9]{64}$ && "$checked" == "$archive" && -z "$extra" ]] ||
               ! printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict; then
              echo available=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo available=true >> "$GITHUB_OUTPUT"
      - if: steps.download.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cores-packaged
          path: cached-cores/wdtt-cores-linux-*.tar.gz*
          if-no-files-found: error
  cores:
    needs: packaged-cores
    if: needs.packaged-cores.outputs.available == 'false'
    uses: ./.github/workflows/cores.yml
  unified:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WDTT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: chmod +x build.sh && ./build.sh ${{ matrix.goarch }} unified
      - uses: actions/upload-artifact@v4
        with:
          name: wdtt-linux-${{ matrix.goarch }}
          path: wdtt-linux-${{ matrix.goarch }}

  release:
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
          needs.unified.result == 'success' && needs.packaged-cores.result == 'success' &&
          (needs.packaged-cores.outputs.available == 'true' || needs.cores.result == 'success') }}
    needs: [unified, packaged-cores, cores]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wdtt-linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cores-*
          merge-multiple: true
          path: dist
      - name: Generate binary checksums
        working-directory: dist
        run: |
          for asset in wdtt-linux-amd64 wdtt-linux-arm64; do
            sha256sum "$asset" > "$asset.sha256"
          done
      - name: Pack controller files
        run: |
          mkdir -p runtime
          install -m 755 scripts/{protocols,edge_protocols,fleet,frontend,preflight,uninstall,panel-firewall}.py runtime/
          git archive --format=tar.gz HEAD > runtime/node-source.tar.gz
          tar -czf dist/wdtt-runtime.tar.gz -C runtime protocols.py edge_protocols.py fleet.py frontend.py preflight.py uninstall.py panel-firewall.py node-source.tar.gz
          cd dist
          sha256sum wdtt-runtime.tar.gz > wdtt-runtime.tar.gz.sha256
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if grep -q "^## \[${TAG}\]" CHANGELOG.md; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          else
            echo "Нет секции ## [${TAG}] в CHANGELOG.md — добавьте перед тегом." > release-notes.md
            echo "Compare: https://github.com/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${{ github.ref_name }}" >> release-notes.md
          fi
          echo "---notes---"
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wdtt-linux-*
            dist/wdtt-cores-linux-*
            dist/wdtt-runtime.tar.gz*
          body_path: release-notes.md
          generate_release_notes: false
